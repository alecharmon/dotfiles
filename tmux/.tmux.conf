

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback
set -g history-limit 50000

# Reduce escape delay
set -sg escape-time 0

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -g wrap-search on

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Gruvbox theme ---
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left '#{?client_prefix,#[bg=colour214 fg=colour235 bold] PREFIX ,#[bg=#458588 fg=#282828 bold] #S }#[bg=#3c3836] '
set -g status-right "#[fg=#83a598]#H #[fg=#a89984]%Y-%m-%d #[fg=#ebdbb2]%H:%M "
set -g status-left-length 30
set -g status-right-length 60

setw -g window-status-format "#[fg=#a89984] #I:#W "
setw -g window-status-current-format "#[bg=#504945,fg=#fabd2f,bold] #I:#W "

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#458588"
set -g message-style "bg=#504945,fg=#ebdbb2"
