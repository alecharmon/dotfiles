# Ensure go/bin and common tool dirs are in PATH for tmux commands (mac + linux)
set-environment -g PATH "$HOME/go/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback
set -g history-limit 50000

# Reduce escape delay
set -sg escape-time 0

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
set -g wrap-search on

# switch panes using Alt-arrow without prefix
# Wrap to previous/next window when at edge
bind -n C-Left run 'if [ "#{pane_at_left}" = "1" ]; then tmux previous-window; else tmux select-pane -L; fi'
bind -n C-Right run 'if [ "#{pane_at_right}" = "1" ]; then tmux next-window; else tmux select-pane -R; fi'
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Ghostty sends these private sequences for Hyper-[ / Hyper-] and Hyper-z / Hyper-x
set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[5;30013~"
set -s user-keys[2] "\e[5;30014~"
set -s user-keys[3] "\e[5;30015~"
set -s user-keys[4] "\e[5;30016~"
set -s user-keys[5] "\e[5;30017~"
set -s user-keys[6] "\e[5;30018~"
set -s user-keys[7] "\e[5;30019~"
set -s user-keys[8] "\e[5;30020~"
bind -n User0 previous-window
bind -n User1 next-window
bind -n User2 previous-window
bind -n User3 next-window
bind -n User4 run-shell '~/dev/dotfiles/scripts/tmux-tabs'
bind -n User5 set -g status
bind -n User6 run-shell '~/dev/dotfiles/scripts/tmux-tabs --select prev'
bind -n User7 run-shell '~/dev/dotfiles/scripts/tmux-tabs --select next'
bind -n User8 run-shell '~/dev/dotfiles/scripts/tmux-hunk-toggle "#{pane_current_path}" "#{window_id}"'

# Intuitive splits (open in current path)
bind \\ split-window -h -c "#{pane_current_path}" 'command -v screensaver >/dev/null 2>&1 && screensaver; exec $SHELL'
bind - split-window -v -c "#{pane_current_path}" 'command -v screensaver >/dev/null 2>&1 && screensaver; exec $SHELL'
unbind '"'
unbind %

# New windows open the recent-project picker; selected repo becomes the shell cwd.
if-shell "test -d ~/dev" \
  "bind c new-window -c ~/dev '~/dev/dotfiles/scripts/tmux-new-recent-project-window.zsh'" \
  "bind c new-window -c ~ '~/dev/dotfiles/scripts/tmux-new-recent-project-window.zsh'"

# Toggle vertical window sidebar
bind -n F9 run-shell '~/dev/dotfiles/scripts/tmux-tabs'

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Tokyo Night theme ---
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left '#{?client_prefix,#[bg=#e0af68 fg=#1a1b26 bold] PREFIX ,#{?pane_in_mode,#{?selection_active,#[bg=#bb9af7 fg=#1a1b26 bold] VISUAL ,#[bg=#9ece6a fg=#1a1b26 bold] NORMAL },#[bg=#7aa2f7 fg=#1a1b26 bold] #S }}#[bg=#1a1b26] '
set -g status-right "#[fg=#7dcfff]#H #[fg=#565f89]%Y-%m-%d #[fg=#a9b1d6]%H:%M "
set -g status-left-length 30
set -g status-right-length 60

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}:#{pane_current_command}"

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#e0af68,bold] #I:#W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#a9b1d6"
