# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: Needs My Review
    filters: is:open review-requested:@me org:florafauna-ai sort:updated-desc
  - title: My PRs
    filters: is:open author:@me org:florafauna-ai sort:updated-desc
  - title: Team PRs
    filters: is:open org:florafauna-ai sort:updated-desc
  - title: Recently Closed
    filters: is:closed author:@me org:florafauna-ai sort:updated-desc

keybindings:
  prs:
    - key: x
      command: gh pr close --repo {{.RepoName}} {{.PrNumber}}
    - key: o
      command: open -a Safari "https://github.com/{{.RepoName}}/pull/{{.PrNumber}}"

defaults:
  view: prs
  refetchIntervalMinutes: 1
  prsLimit: 20
  issuesLimit: 20
  preview:
    open: true
    width: 0.45
pager:
  diff: delta
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
