[package]
name = "tmux-tabs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Vertical window sidebar for tmux (Rust port of the Python/Textual tool)"

[[bin]]
name = "tmux-tabs"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
unicode-width = "0.1"

[dev-dependencies]
# e2e tests drive a real tmux server; no extra crates needed.

[profile.release]
opt-level = 2
lto = false
