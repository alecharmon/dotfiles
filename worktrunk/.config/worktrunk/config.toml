# Worktrunk configuration
# https://worktrunk.dev/config/

# Where new worktrees are created
worktree-path = "~/worktrees/{{ repo }}/{{ branch | sanitize }}"

# LLM-generated commit messages
[commit.generation]
command = "claude -p --model=haiku 'Write a concise commit message for these changes' || git log --oneline -1 --format='wip: %s'"

# Default behaviors
[commit]
stage = "tracked"

[merge]
squash = true
remove = true

[post-switch]
tmux = "[ -n \"$TMUX\" ] && tmux rename-window {{ branch | sanitize }}"

[aliases]
pr = "sh -c 'input=${1:?usage: wt pr <url-or-number>}; clean=${input%%[?#]*}; clean=${clean%/}; n=${clean##*/}; case $n in *[!0-9]*|\"\") echo \"usage: wt pr <url-or-number>\" >&2; exit 2;; esac; exec wt switch pr:$n' -- {{ args }}"

# Warm new worktrees: copy gitignored env vars, deps, and build caches from the
# source worktree (scoped by the repo's .worktreeinclude). Opt-in per repo — only
# fires when the primary worktree has a .worktreeinclude, so other repos are
# unaffected. APFS reflink makes this near-instant and space-free (copy-on-write).
[pre-start]
copy = "test -f {{ primary_worktree_path }}/.worktreeinclude && wt step copy-ignored || true"
